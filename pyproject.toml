[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogmem"
version = "0.1.0"
description = "Cognitive Memory Network: hybrid symbolic-neural-structured retrieval for long-term conversation memory"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Haifeng Hong", email = "314990283@qq.com"},
]
keywords = ["memory", "llm", "rag", "knowledge-graph", "conversation", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/honghaifeng/cogmem"
Repository = "https://github.com/honghaifeng/cogmem"
Issues = "https://github.com/honghaifeng/cogmem/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cogmem*"]
