<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="barBaseline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="barCognitive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="barCogMem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="barCogMemZh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="720" height="440" rx="16" fill="url(#bg3)"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">消融实验：各路径对准确率的贡献</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#64748b">LLM 后端: DeepSeek-V3 · 相同 LLM 确保公平对比</text>

  <!-- Y axis -->
  <line x1="80" y1="80" x2="80" y2="340" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="680" y2="340" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Y axis labels -->
  <text x="72" y="345" text-anchor="end" font-size="10" fill="#94a3b8">0%</text>
  <text x="72" y="276" text-anchor="end" font-size="10" fill="#94a3b8">25%</text>
  <text x="72" y="207" text-anchor="end" font-size="10" fill="#94a3b8">50%</text>
  <text x="72" y="138" text-anchor="end" font-size="10" fill="#94a3b8">75%</text>
  <text x="72" y="84" text-anchor="end" font-size="10" fill="#94a3b8">100%</text>

  <!-- Grid lines -->
  <line x1="80" y1="276" x2="680" y2="276" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="207" x2="680" y2="207" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="138" x2="680" y2="138" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- CLongEval (Chinese) group -->
  <text x="180" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">CLongEval (中文)</text>
  <text x="180" y="386" text-anchor="middle" font-size="10.5" fill="#64748b">70 组对话 · 358 题</text>

  <!-- Baseline 90.50% -->
  <rect x="100" y="88" width="50" height="252" rx="4" fill="url(#barBaseline)" opacity="0.9"/>
  <text x="125" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6">90.5%</text>

  <!-- Cognitive 89.39% -->
  <rect x="160" y="93" width="50" height="247" rx="4" fill="url(#barCognitive)" opacity="0.9"/>
  <text x="185" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#f59e0b">89.4%</text>

  <!-- CogMem 89.11% -->
  <rect x="220" y="93" width="50" height="247" rx="4" fill="url(#barCogMem)" opacity="0.9"/>
  <text x="245" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">89.1%</text>

  <!-- CogMem bge-zh 92.18% -->
  <rect x="280" y="81" width="50" height="259" rx="4" fill="url(#barCogMemZh)" opacity="0.9"/>
  <text x="305" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#8b5cf6">92.2%</text>

  <!-- Divider -->
  <line x1="400" y1="80" x2="400" y2="390" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- LoCoMo (English) group -->
  <text x="540" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">LoCoMo (英文)</text>
  <text x="540" y="386" text-anchor="middle" font-size="10.5" fill="#64748b">10 组对话 · 1,542 题</text>

  <!-- Baseline 64.85% -->
  <rect x="460" y="162" width="50" height="178" rx="4" fill="url(#barBaseline)" opacity="0.9"/>
  <text x="485" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6">64.9%</text>

  <!-- Cognitive 68.74% -->
  <rect x="520" y="151" width="50" height="189" rx="4" fill="url(#barCognitive)" opacity="0.9"/>
  <text x="545" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#f59e0b">68.7%</text>

  <!-- CogMem 75.16% -->
  <rect x="580" y="131" width="50" height="209" rx="4" fill="url(#barCogMem)" opacity="0.9"/>
  <text x="605" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">75.2%</text>

  <!-- Legend -->
  <rect x="80" y="402" width="560" height="28" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <rect x="92" y="410" width="12" height="12" rx="3" fill="url(#barBaseline)"/>
  <text x="110" y="420" font-size="11" fill="#475569">Baseline (FTS5)</text>
  <rect x="212" y="410" width="12" height="12" rx="3" fill="url(#barCognitive)"/>
  <text x="230" y="420" font-size="11" fill="#475569">Cognitive (FTS+SA)</text>
  <rect x="352" y="410" width="12" height="12" rx="3" fill="url(#barCogMem)"/>
  <text x="370" y="420" font-size="11" fill="#475569">CogMem (FTS+Vec+SA)</text>
  <rect x="510" y="410" width="12" height="12" rx="3" fill="url(#barCogMemZh)"/>
  <text x="528" y="420" font-size="11" fill="#475569">CogMem (bge-small-zh)</text>
</svg>
