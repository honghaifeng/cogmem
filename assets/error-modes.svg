<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="honestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hallucGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="otherGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="720" height="460" rx="16" fill="url(#bg5)"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">错误模式分析：诚实率 vs 幻觉率</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#64748b">CLongEval 中文 · 各 LLM 后端错误分布</text>

  <!-- Y axis -->
  <line x1="100" y1="80" x2="100" y2="380" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="100" y1="380" x2="680" y2="380" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="92" y="385" text-anchor="end" font-size="10" fill="#94a3b8">0</text>
  <text x="92" y="305" text-anchor="end" font-size="10" fill="#94a3b8">25</text>
  <text x="92" y="230" text-anchor="end" font-size="10" fill="#94a3b8">50</text>
  <text x="92" y="155" text-anchor="end" font-size="10" fill="#94a3b8">75</text>
  <text x="92" y="85" text-anchor="end" font-size="10" fill="#94a3b8">100%</text>

  <line x1="100" y1="305" x2="680" y2="305" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="100" y1="230" x2="680" y2="230" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="100" y1="155" x2="680" y2="155" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- DeepSeek-V3: 39 errors, 31 honest (79.5%), 3 halluc (7.7%), 5 other (12.8%) -->
  <!-- Total bar height = 39 * 300/100 = 117px -->
  <rect x="120" y="263" width="80" height="117" rx="4" fill="url(#honestGrad)" opacity="0.9"/>
  <rect x="120" y="263" width="80" height="9" rx="4" fill="url(#hallucGrad)"/>
  <rect x="120" y="272" width="80" height="15" fill="url(#otherGrad)"/>
  <text x="160" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">79.5%</text>
  <text x="160" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">DeepSeek-V3</text>
  <text x="160" y="412" text-anchor="middle" font-size="10" fill="#64748b">39 错误</text>

  <!-- ARK V4-Flash: 69 errors, 29 honest (42.0%), 14 halluc (20.3%), 26 other (37.7%) -->
  <rect x="230" y="210" width="80" height="170" rx="4" fill="url(#otherGrad)" opacity="0.8"/>
  <rect x="230" y="210" width="80" height="50" rx="4" fill="url(#honestGrad)" opacity="0.9"/>
  <rect x="230" y="210" width="80" height="24" rx="4" fill="url(#hallucGrad)"/>
  <text x="270" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">42.0%</text>
  <text x="270" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">DS-V4-Flash</text>
  <text x="270" y="412" text-anchor="middle" font-size="10" fill="#64748b">69 错误</text>

  <!-- Qwen3.8-Flash: 86 errors, 23 honest (26.7%), 38 halluc (44.2%), 25 other (29.1%) -->
  <rect x="340" y="172" width="80" height="208" rx="4" fill="url(#otherGrad)" opacity="0.8"/>
  <rect x="340" y="172" width="80" height="46" rx="4" fill="url(#honestGrad)" opacity="0.9"/>
  <rect x="340" y="172" width="80" height="72" rx="4" fill="url(#hallucGrad)"/>
  <text x="380" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#e11d48">44.2%</text>
  <text x="380" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Qwen3.8-Flash</text>
  <text x="380" y="412" text-anchor="middle" font-size="10" fill="#64748b">86 错误</text>

  <!-- Qwen-Max: 86 errors, 31 honest (36.0%), 36 halluc (41.9%), 19 other (22.1%) -->
  <rect x="450" y="198" width="80" height="182" rx="4" fill="url(#otherGrad)" opacity="0.8"/>
  <rect x="450" y="198" width="80" height="40" rx="4" fill="url(#honestGrad)" opacity="0.9"/>
  <rect x="450" y="198" width="80" height="68" rx="4" fill="url(#hallucGrad)"/>
  <text x="490" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#e11d48">41.9%</text>
  <text x="490" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Qwen-Max</text>
  <text x="490" y="412" text-anchor="middle" font-size="10" fill="#64748b">86 错误</text>

  <!-- GPT-5.6-sol: 67 errors, 9 honest (13.4%), 37 halluc (55.2%), 21 other (31.4%) -->
  <rect x="560" y="218" width="80" height="162" rx="4" fill="url(#otherGrad)" opacity="0.8"/>
  <rect x="560" y="218" width="80" height="51" rx="4" fill="url(#otherGrad)"/>
  <rect x="560" y="218" width="80" height="60" rx="4" fill="url(#honestGrad)" opacity="0.9"/>
  <rect x="560" y="218" width="80" height="90" rx="4" fill="url(#hallucGrad)"/>
  <text x="600" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#e11d48">55.2%</text>
  <text x="600" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">GPT-5.6-sol</text>
  <text x="600" y="412" text-anchor="middle" font-size="10" fill="#64748b">67 错误</text>

  <!-- Legend -->
  <rect x="80" y="430" width="560" height="22" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <rect x="92" y="436" width="10" height="10" rx="2" fill="url(#honestGrad)"/>
  <text x="108" y="445" font-size="10.5" fill="#475569">诚实 ("未记录")</text>
  <rect x="220" y="436" width="10" height="10" rx="2" fill="url(#hallucGrad)"/>
  <text x="236" y="445" font-size="10.5" fill="#475569">幻觉 (编造)</text>
  <rect x="340" y="436" width="10" height="10" rx="2" fill="url(#otherGrad)"/>
  <text x="356" y="445" font-size="10.5" fill="#475569">其他错误</text>
  <text x="460" y="445" font-size="10.5" font-weight="600" fill="#059669">→ 诚实率越高，准确率越高</text>
</svg>
