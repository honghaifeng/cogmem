<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="structGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="fusionGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fff"/>
    </marker>
  </defs>

  <rect width="760" height="500" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">CogMem 三路径混合检索架构</text>

  <!-- Input -->
  <rect x="280" y="56" width="200" height="40" rx="10" fill="#1e293b"/>
  <text x="380" y="74" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">用户查询</text>
  <text x="380" y="90" text-anchor="middle" font-size="11" fill="#cbd5e1">"Alice 要搬去哪里？"</text>

  <!-- Arrow down -->
  <line x1="380" y1="96" x2="380" y2="116" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Three storage boxes -->
  <!-- Path 1: Symbolic -->
  <rect x="30" y="120" width="210" height="110" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="30" y="120" width="210" height="32" rx="12" fill="url(#symbolGrad)"/>
  <rect x="30" y="138" width="210" height="14" fill="url(#symbolGrad)"/>
  <text x="135" y="141" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">符号检索 · Symbolic</text>
  <text x="135" y="172" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">FTS5 全文检索</text>
  <text x="135" y="190" text-anchor="middle" font-size="10.5" fill="#3b82f6">英文: BM25 关键词匹配</text>
  <text x="135" y="206" text-anchor="middle" font-size="10.5" fill="#3b82f6">中文: LIKE + 关键词提取</text>
  <text x="135" y="222" text-anchor="middle" font-size="10" fill="#64748b" font-weight="600">权重: 0.4</text>

  <!-- Path 2: Neural -->
  <rect x="275" y="120" width="210" height="110" rx="12" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="275" y="120" width="210" height="32" rx="12" fill="url(#neuralGrad)"/>
  <rect x="275" y="138" width="210" height="14" fill="url(#neuralGrad)"/>
  <text x="380" y="141" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">神经检索 · Neural</text>
  <text x="380" y="172" text-anchor="middle" font-size="11" fill="#6b21a8" font-weight="600">向量余弦相似度</text>
  <text x="380" y="190" text-anchor="middle" font-size="10.5" fill="#8b5cf6">SentenceTransformer 嵌入</text>
  <text x="380" y="206" text-anchor="middle" font-size="10.5" fill="#8b5cf6">英文: all-MiniLM-L6-v2</text>
  <text x="380" y="222" text-anchor="middle" font-size="10" fill="#64748b" font-weight="600">权重: 0.6</text>

  <!-- Path 3: Structured -->
  <rect x="520" y="120" width="210" height="110" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="520" y="120" width="210" height="32" rx="12" fill="url(#structGrad)"/>
  <rect x="520" y="138" width="210" height="14" fill="url(#structGrad)"/>
  <text x="625" y="141" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">结构化检索 · Structured</text>
  <text x="625" y="172" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">实体-关系扩散激活</text>
  <text x="625" y="190" text-anchor="middle" font-size="10.5" fill="#f59e0b">知识图谱 1-hop 传播</text>
  <text x="625" y="206" text-anchor="middle" font-size="10.5" fill="#f59e0b">decay=0.5, hop_factor=0.8</text>
  <text x="625" y="222" text-anchor="middle" font-size="10" fill="#64748b" font-weight="600">补充增强</text>

  <!-- Arrows to fusion -->
  <line x1="135" y1="230" x2="135" y2="270" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="380" y1="230" x2="380" y2="270" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="625" y1="230" x2="625" y2="270" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Fusion box -->
  <rect x="100" y="276" width="560" height="70" rx="12" fill="url(#fusionGrad)"/>
  <text x="380" y="304" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">加权融合 &amp; 去重排序</text>
  <text x="380" y="324" text-anchor="middle" font-size="11.5" fill="#d1fae5">归一化各路分数 → 按 dedup_key 去重 → 加权合并 → 多路命中加分</text>
  <text x="380" y="340" text-anchor="middle" font-size="10.5" fill="#a7f3d0">score = norm(FTS) × 0.4 + norm(Vector) × 0.6 + entity_bonus × 0.3</text>

  <!-- Arrow down -->
  <line x1="380" y1="346" x2="380" y2="372" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Output -->
  <rect x="200" y="376" width="360" height="48" rx="10" fill="#1e293b"/>
  <text x="380" y="396" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Top-K 记忆片段 → 送入 LLM 生成回答</text>
  <text x="380" y="414" text-anchor="middle" font-size="11" fill="#cbd5e1">返回 {"memory", "score", "type"} 列表</text>

  <!-- Bottom insight -->
  <rect x="60" y="442" width="640" height="44" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="80" y="462" font-size="11.5" font-weight="600" fill="#075985">消融实验结论：</text>
  <text x="80" y="478" font-size="11" fill="#0369a1">英文: 向量检索 +10.31pp | 中文: 切换 bge-small-zh 后 +1.68pp | 多跳推理: 扩散激活 +19.0pp</text>
</svg>
